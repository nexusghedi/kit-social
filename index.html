header{display:flex;flex-direction:column;gap:6px}
h1{margin:0;font-size:1.75rem;line-height:1.15;font-weight:900;text-wrap:balance}
.lead{margin:0;color:var(--muted);font-size:.95rem}
.come{display:flex;flex-wrap:wrap;gap:6px 14px;margin:4px 0 0;padding:0;list-style:none;font-size:.85rem;color:var(--muted)}

</head>

    <span class="quando" style="background:${e.col};${e.col.includes('corsi')?'color:#fff':''}">${esc(e.quando)}</span>
    <h2>${esc(e.titolo)}</h2>
    ${(e.stato||[]).filter(attivo).map(x=>`<span class="stato ${x.tipo}">${esc(x.t)}</span>`).join('')}
    <div class="link"><a href="${e.url}" target="_blank" rel="noopener">Articolo sul sito</a></div>
   </div>
  </div>
  <div class="canali" role="tablist">${Object.entries(CANALI).map(([k,n])=>`<button role="tab" aria-selected="${k===c}" data-canale-btn="${k}">${n} <span class="n">${conta(k)}</span></button>`).join('')}</div>
  <p class="ev-avviso" data-evavviso hidden></p>
  <div class="msgs">${(()=>{const l=e.msgs.filter(m=>scheda(m)===c);return l.length?l.map((m,i)=>voce(e,m,i===0)).join(''):'<div class="vuoto">Niente da pubblicare qui per questo evento.</div>'})()}</div>
 </section>`}).join('');
 document.querySelectorAll('textarea[data-k]').forEach(aggiorna);
}
function aggiorna(ta){
 const c=ta.closest('.corpo');const parti=ta.value.match(/\[[^\]]+\]/g)||[];const n=parti.length;
 const av=c.querySelector('[data-avviso]');av.hidden=!n;
 av.querySelector('ul').innerHTML=parti.map(x=>`<li>${esc(x)}</li>`).join('');
 const w=c.querySelector('[data-wa]');if(w)w.href='https://wa.me/?text='+encodeURIComponent(ta.value);
 c.querySelectorAll('.azioni .btn:not([data-salva])').forEach(bt=>{bt.classList.toggle('bloccato',!!n);bt.setAttribute('aria-disabled',n?'true':'false')});
 c.querySelector('[data-ripristina]').hidden=store.get(ta.dataset.k)===null;
 const d=ta.closest('details');d.classList.toggle('dacompletare',!!n);
 const s=d.querySelector('summary');let b=s.querySelector('[data-badge]');
 if(n&&!b){b=document.createElement('span');b.className='badge';b.dataset.badge='';b.textContent='DA COMPLETARE';s.insertBefore(b,s.lastElementChild)}
 if(!n&&b)b.remove();
 riepilogo();
}
const GIORNO=['dom','lun','mar','mer','gio','ven','sab'][new Date().getDay()];
const daOggi=m=>attivo(m)&&(m.invio||[]).some(d=>d===OGGI||d===GIORNO);
function oggi(){
 const l=[];EVENTI.forEach(e=>e.msgs.filter(daOggi).forEach(m=>l.push({ev:e.id,m:m.id,c:scheda(m),label:m.label,tit:e.titolo,can:m.canale==='storia'?'Storia':CANALI[m.canale]})));
 const el=$('#oggi');el.hidden=!l.length;
 el.innerHTML=l.length?`<strong>📅 Da mandare oggi</strong>`+l.map(x=>`<a href="#${x.ev}" data-vai="${x.ev}|${x.m}|${x.c}">${esc(x.can)} · ${esc(x.label)} · ${esc(x.tit)}</a>`).join(''):'';
}
function riepilogo(){
 const lista=[];
 EVENTI.forEach(e=>{
  const sec=document.getElementById(e.id);if(!sec)return;
  const pend=e.msgs.filter(attivo).filter(m=>nQuadre(store.get(chiave(e,m))??m.t));
  const ea=sec.querySelector('[data-evavviso]');ea.hidden=!pend.length;
  ea.textContent=pend.length?`⚠ ${pend.length===1?'1 messaggio':pend.length+' messaggi'} da completare prima dell'invio`:'';
  pend.forEach(m=>lista.push({ev:e.id,m:m.id,c:scheda(m),label:m.label,tit:e.titolo}));
 });
 const el=$('#sospesi');el.hidden=!lista.length;
 el.innerHTML=lista.length?`<strong>⚠ ${lista.length===1?'C\'è un messaggio':'Ci sono '+lista.length+' messaggi'} da completare</strong>`+lista.map(x=>`<a href="#${x.ev}" data-vai="${x.ev}|${x.m}|${x.c}">${esc(x.label)} · ${esc(x.tit)}</a>`).join(''):'';
}
render();oggi();

document.addEventListener('input',ev=>{
 const ta=ev.target.closest('textarea[data-k]');if(!ta)return;
 store.set(ta.dataset.k,ta.value);aggiorna(ta);
});
async function copia(testo,ta){
 try{await navigator.clipboard.writeText(testo);return true}
 catch(e){if(ta){ta.focus();ta.select()}return false}
}
async function blobDi(src){const r=await fetch(src);return await r.blob()}
document.addEventListener('click',async ev=>{
 const z=ev.target.closest('[data-zoom]');
 if(z){const zm=$('#zoom');zm.querySelector('img').src=z.src;zm.hidden=false;return}
 if(ev.target.closest('#zoom')){$('#zoom').hidden=true;return}
 const cb=ev.target.closest('[data-canale-btn]');
 if(cb){const sec=cb.closest('.evento');CANALE[sec.id]=cb.dataset.canaleBtn;store.set('kit3:canali',JSON.stringify(CANALE));render();document.getElementById(sec.id).scrollIntoView({block:'start'});return}
 const vai=ev.target.closest('[data-vai]');
 if(vai){ev.preventDefault();const [eid,mid,c]=vai.dataset.vai.split('|');CANALE[eid]=c;render();const t=document.getElementById(eid+'-'+mid);t.closest('details').open=true;t.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>t.focus({preventScroll:true}),400);return}
 const blk=ev.target.closest('.btn.bloccato');
 if(blk){ev.preventDefault();const t=blk.closest('.corpo').querySelector('textarea');toast('Prima completa le parti tra [quadre]');t.focus();return}
 const corpo=ev.target.closest('.corpo');if(!corpo)return;
 const ta=corpo.querySelector('textarea');const [e,m]=trova(ta.dataset.ev,ta.dataset.m);
 if(ev.target.closest('[data-copia]')){toast(await copia(ta.value,ta)?(m.canale==='storia'?'Link copiato':'Testo copiato'):'Testo selezionato: tieni premuto e scegli Copia');return}
 if(ev.target.closest('[data-ripristina]')){store.del(ta.dataset.k);ta.value=m.t;aggiorna(ta);toast('Testo originale ripristinato');return}
 const sh=ev.target.closest('[data-condividi]');
 if(sh){
  const modo=sh.dataset.condividi;
  if(modo==='copia'){await copia(ta.value,ta)}
  try{const fs=await Promise.all((m.imgs||[m.img]).map(async(u,i)=>new File([await blobDi(u)],String(i+1).padStart(2,'0')+'-'+u.split('/').pop(),{type:'image/jpeg'})));
   const dati=modo==='testo'?{files:fs,text:ta.value}:{files:fs};
   if(navigator.canShare&&navigator.canShare({files:fs})){
    if(modo==='copia')toast('Didascalia copiata: nell\'app tieni premuto e scegli Incolla');
    if(modo==='solo')toast('Poi aggiungi l\'adesivo link: il link è nel riquadro');
    await navigator.share(dati);return}
   toast('Questo browser non condivide immagini: usa «Salva immagine»')}
  catch(err){if(err&&err.name==='AbortError')return;toast('Condivisione non riuscita, riprova')}
  return}
 if(ev.target.closest('[data-salva]')){
  const nome='nexus-'+e.id+'-'+m.img.split('/').pop();
  if(!dl){const zm=$('#zoom');zm.querySelector('img').src=m.img;zm.hidden=false;toast('Tieni premuto sull\'immagine per salvarla');return}
  try{await dl.save({filename:nome,data:await blobDi(m.img)});toast('Immagine salvata nei download')}
  catch(err){const c=err&&err.code;if(c==='declined')return;if(c==='rate_limited'){toast('Un attimo: c\'è già una richiesta aperta');return}
   const zm=$('#zoom');zm.querySelector('img').src=m.img;zm.hidden=false;toast('Tieni premuto sull\'immagine per salvarla')}
 }
});
function apriHash(){
 const h=decodeURIComponent(location.hash.slice(1));if(!h)return;
 const e=EVENTI.find(x=>h===x.id||h.startsWith(x.id+'-'));if(!e)return;
 const mid=h.slice(e.id.length+1);const m=mid&&e.msgs.find(x=>x.id===mid);
 if(m){CANALE[e.id]=scheda(m)}render();
 setTimeout(()=>{
  if(!m){document.getElementById(e.id).scrollIntoView({block:'start'});return}
  const t=document.getElementById(e.id+'-'+m.id);if(!t)return;const d=t.closest('details');if(d)d.open=true;
  const box=d||t;box.scrollIntoView({behavior:'smooth',block:'start'});box.classList.add('evidenzia');setTimeout(()=>box.classList.remove('evidenzia'),2600)},60)}
window.addEventListener('hashchange',apriHash);
setTimeout(apriHash,0);
if(IN_CLAUDE){(async()=>{try{dl=await window.claude.use('downloads')}catch(e){dl=null}})()}
</script>
