<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141513" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icona-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icona-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Kit Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Kit Nexus — stili condivisi dei mockup (stessi nomi che userebbe la pagina reale) */
.app{
  --bg:#f4f5f2; --card:#ffffff; --sunk:#ecede8; --ink:#1d1d1b; --muted:#575756; --line:#e3e3df; --line-strong:#cfd0cb;
  --azione:#0e8534; --azione-press:#0b6e2b; --azione-tint:#e4f2e8; --azione-testo:#0b6e2b;
  --arancio:#ef7d32; --blu:#0163a5; --giallo:#f8ba32; --verde:#109439; --rosso:#e74035;
  --warn-bg:#fff3d1; --warn-line:#efd58a; --warn-ink:#6b4a00; --warn-mark:#ffe7a3;
  --red-bg:#fde8e6; --red-ink:#a5221a; --grey-bg:#ebebe8; --grey-ink:#4a4a48;
  --focus:#0163a5; --shadow:0 1px 2px rgba(29,29,27,.06),0 4px 14px rgba(29,29,27,.06);
  font-family:"Nunito",system-ui,sans-serif; color:var(--ink); background:var(--bg);
  position:relative; overflow:hidden; box-sizing:border-box; font-size:16px; line-height:1.45;
}
.app *,.app *::before,.app *::after{box-sizing:border-box}
.app.dark{
  --bg:#141513; --card:#1f201d; --sunk:#2a2b27; --ink:#f2f2ed; --muted:#b9b9b2; --line:#33342f; --line-strong:#4a4b45;
  --azione:#0e8534; --azione-tint:#183823; --azione-testo:#6fd28f;
  --warn-bg:#3a2f12; --warn-line:#5c4a1a; --warn-ink:#ffd978; --warn-mark:#5a4815;
  --red-bg:#3d1c19; --red-ink:#ff9d94; --grey-bg:#2c2d29; --grey-ink:#cfcfc8; --focus:#6cb6ff;
  --shadow:none;
}
:where(.app) :where(button,input,textarea){font-family:inherit;font-size:inherit;color:inherit}
:where(.app) :where(a){color:var(--azione-testo)}

/* icone (tratto, colore = currentColor) */
.ic{display:inline-block;width:20px;height:20px;flex:none;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.ic.s{width:16px;height:16px}.ic.l{width:24px;height:24px}
.i-chat{--m:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.8-.9L3 20.5l1.6-4.6A8.4 8.4 0 0 1 3.5 11.5 8.5 8.5 0 0 1 12 3a8.5 8.5 0 0 1 9 8.5z'/></svg>")}

.i-alert{--m:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01'/></svg>")}

.i-help{--m:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01'/></svg>")}

.i-more{--m:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='black'><circle cx='5' cy='12' r='2'/><circle cx='12' cy='12' r='2'/><circle cx='19' cy='12' r='2'/></svg>")}

/* struttura */
.topbar{height:56px;padding:0 8px 0 16px;display:flex;align-items:center;gap:10px}
.topbar .logo{width:28px;height:28px}
.topbar h1{margin:0;font-size:19px;font-weight:800;flex:1;letter-spacing:-.01em}
.screen{padding:0 16px 100px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 10px}
.sec h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sec span{font-size:13px;font-weight:700;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.muted{color:var(--muted)}
.t-title{font-size:17px;font-weight:800;line-height:1.25;margin:0}
.t-meta{font-size:13.5px;font-weight:600;color:var(--muted);line-height:1.3}
.t-body{font-size:15px;line-height:1.5}
.fold-x{position:absolute;left:0;right:0;border-top:2px dashed #c43b7d;z-index:9;pointer-events:none}
.fold span{position:absolute;right:8px;top:-22px;background:#c43b7d;color:#fff;font:700 11px/1 "Nunito",sans-serif;padding:4px 8px;border-radius:6px}

/* barra in basso */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:72px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:6px 8px 10px}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:12.5px;font-weight:700;position:relative}
.tabbar a .pill{width:56px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.tabbar a[aria-current="page"]{color:var(--ink)}
.tabbar a[aria-current="page"] .pill{background:var(--azione-tint);color:var(--azione-testo)}
.tabbar .badge{position:absolute;top:2px;left:calc(50% + 8px)}

/* tasti */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;text-decoration:none;border-radius:14px;font-weight:800;white-space:nowrap}
.btn-pri,.app .btn-pri{height:54px;width:100%;background:var(--azione);color:#ffffff;font-size:17px}
.btn-pri.press{background:var(--azione-press)}
.btn-pri[disabled],.btn-pri.locked{background:var(--sunk);color:#5f5f5b;cursor:not-allowed}
.dark .btn-pri[disabled],.dark .btn-pri.locked{color:#b9b9b2}
.btn-sec{height:48px;background:var(--card);color:var(--ink);border:1.5px solid var(--line-strong);font-size:15.5px;padding:0 16px}
.btn-sec[disabled]{color:#6b6b67;border-color:var(--line);background:var(--sunk)}
.btn-ghost{height:44px;background:transparent;color:var(--azione-testo);font-size:15px;font-weight:800;padding:0 10px}
.btn-ghost[disabled]{color:#77776f}
.btn-icon{width:44px;height:44px;border-radius:12px;background:transparent;color:var(--ink);border:0;display:flex;align-items:center;justify-content:center;flex:none}
.btn-icon.bordered{border:1.5px solid var(--line-strong);background:var(--card)}
.focus{outline:3px solid var(--focus);outline-offset:2px}
.actions{display:flex;flex-direction:column;gap:6px}
.actions .alt{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}

/* pillole */
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--azione);color:#fff;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.badge.warn{background:var(--giallo);color:#1d1d1b}
.st{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:800;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st-open{background:var(--azione-tint);color:var(--azione-testo)}
.st-last{background:var(--red-bg);color:var(--red-ink)}
.st-free{background:var(--warn-bg);color:var(--warn-ink)}
.st-full{background:var(--grey-bg);color:var(--grey-ink)}
.st-info{background:transparent;color:var(--muted);border:1.5px solid var(--line-strong)}
.st-info::before{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:800;white-space:nowrap}
.chip-today{background:var(--azione);color:#fff}
.chip-todo{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line)}
.chip-done{background:var(--grey-bg);color:var(--grey-ink)}
.chip-edit{background:var(--sunk);color:var(--muted)}
.fmt{display:inline-flex;height:24px;align-items:center;padding:0 9px;border-radius:8px;background:var(--sunk);font-size:12.5px;font-weight:800;color:var(--ink)}

/* data per area */
.date{width:54px;height:58px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.date b{font-size:21px;font-weight:800}
.date small{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.a-viaggi{background:var(--arancio);color:#1d1d1b}
.a-corsi{background:var(--blu);color:#fff}
.a-conf{background:var(--giallo);color:#1d1d1b}
.a-ass{background:var(--azione);color:#fff}
.tag{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}

/* riga evento (card chiusa) */
.ev{display:flex;align-items:center;gap:12px;padding:10px 6px 10px 10px;text-decoration:none;color:inherit;min-height:78px}
.ev .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ev .ttl{font-size:16px;font-weight:800;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ev .todo{font-size:12.5px;font-weight:800;color:var(--warn-ink);display:inline-flex;align-items:center;gap:4px}
.ev .chev{color:var(--muted)}

/* elenco "da mandare oggi" */
.today{padding:6px}
.today-h{display:flex;align-items:center;gap:8px;padding:8px 10px 6px}
.today-h h2{margin:0;font-size:16px;font-weight:800;flex:1}
.go{display:flex;align-items:center;gap:12px;padding:8px 6px 8px 10px;border-radius:12px;text-decoration:none;color:inherit;min-height:60px}
.go + .go{border-top:1px solid var(--line)}
.go .ico{width:40px;height:40px;border-radius:12px;background:var(--azione-tint);color:var(--azione-testo);display:flex;align-items:center;justify-content:center;flex:none}
.go .txt{flex:1;min-width:0}
.go b{display:block;font-size:15.5px;font-weight:800;line-height:1.25}
.go small{display:block;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* avviso */
.alert{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;border-radius:14px;font-size:15px;font-weight:700;text-decoration:none;min-height:52px}
.alert-warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line)}
.alert-info{background:var(--sunk);color:var(--ink)}
.alert-ok{background:var(--azione-tint);color:var(--azione-testo)}
.alert .grow{flex:1}

/* scheda evento */
.evhead{padding:4px 16px 14px;display:flex;flex-direction:column;gap:10px}
.evhead h1{margin:0;font-size:23px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--sunk);padding:4px;border-radius:16px;margin:0 16px}
.tabs button{position:relative;height:58px;border:0;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:800;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs .n{position:absolute;top:5px;right:8px;font-size:11px;font-weight:800;color:var(--muted)}
.tabs .dot{position:absolute;top:7px;left:calc(50% + 9px);width:9px;height:9px;border-radius:50%;background:var(--giallo);box-shadow:0 0 0 2px var(--sunk)}
.tabs button[aria-selected="true"] .dot{box-shadow:0 0 0 2px var(--card)}

/* riga messaggio apribile */
.msg{overflow:hidden}
.msg-h{width:100%;display:flex;align-items:center;gap:12px;padding:12px 10px 12px 12px;background:transparent;border:0;text-align:left;cursor:pointer;min-height:68px}
.msg-h .ico{width:40px;height:40px;border-radius:12px;background:var(--sunk);display:flex;align-items:center;justify-content:center;flex:none}
.msg-h .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.msg-h b{font-size:16px;font-weight:800;line-height:1.25}
.msg-h .side{display:flex;align-items:center;gap:6px}
.msg-h .chevbox{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.msg.todo .msg-h .ico{background:var(--warn-bg);color:var(--warn-ink)}
.msg-b{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line)}
.msg-b > :first-child{margin-top:14px}

/* anteprima immagini */
.media{display:flex;gap:8px}

 else if(h==='risorse'||h==='comunicazioni'||h==='guida'){html=viewRisorse();VISTA='risorse';el=h==='risorse'?null:h}
 else{const e=trovaEv(h);
  if(!e){html=viewHome();VISTA='home'}
  else{const r=h.slice(e.id.length+1);
   if(!r||r==='social'||r==='stampa'||r==='info'){html=viewEvento(e,r||'wa');VISTA='ev:'+e.id+':'+(r||'wa')}
   else{const m=e.msgs.find(x=>x.id===r);
    if(m){html=viewFocus(e,m);VISTA='focus'}else{html=viewEvento(e,'wa');VISTA='ev:'+e.id+':wa'}}}}
 app.innerHTML=html;
 if(el)setTimeout(()=>{const t=document.getElementById(el);if(t)t.scrollIntoView({block:'start'})},30);else window.scrollTo(0,scroll);
 if(APRI_DOPO){const t=document.getElementById('m-'+APRI_DOPO.replace(':','-'));APRI_DOPO=null;if(t){t.scrollIntoView({block:'start'});t.classList.add('evidenzia');setTimeout(()=>t.classList.remove('evidenzia'),2400)}}
}
let APRI_DOPO=null;
function rerender(keepScroll=true){const y=window.scrollY;route();if(keepScroll)window.scrollTo(0,y)}
window.addEventListener('hashchange',()=>route());

/* ---------- AZIONI ---------- */
const toastEl=$('#toast');let tt;
function toast(t,err){toastEl.innerHTML=`<span class="${err?'err':'ok'}">${ic(err?'x':'check','s')}</span><span class="grow">${esc(t)}</span>`;toastEl.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toastEl.hidden=true,3200)}
async function copia(t){try{await navigator.clipboard.writeText(t);return true}catch(e){return false}}
async function blobDi(src){const r=await fetch(src);return await r.blob()}
const trova=(ev,id)=>{const e=EVENTI.find(x=>x.id===ev);return [e,e.msgs.find(m=>m.id===id)]};
function zoom(src,mat){const z=$('#zoom');z.querySelector('img').src=src;const a=z.querySelector('.zoom-az');
 if(mat){const [ev,id]=mat.split('|');const x=(MAT[ev]||[]).find(y=>y.id===id);a.innerHTML=`<a class="btn btn-pri" href="${x.file}" download="${nomeFile(x)}" target="_blank" rel="noopener">${ic('download')}Scarica</a><button class="btn btn-sec" data-file="${x.file}" data-nome="${nomeFile(x)}">${ic('share')}Condividi</button>`;a.hidden=false}else{a.hidden=true}
 z.hidden=false}
document.addEventListener('click',async ev=>{
 const t=ev.target;
 const z=t.closest('[data-zoom]');if(z){ev.preventDefault();zoom(z.dataset.zoom,z.dataset.mat);return}
 if(t.closest('#zoom')&&!t.closest('.zoom-az')){$('#zoom').hidden=true;return}
 const ap=t.closest('[data-apri]');if(ap){const k=ap.dataset.apri;OPEN.has(k)?OPEN.delete(k):OPEN.add(k);rerender();return}
 const ad=t.closest('[data-apri-dopo]');if(ad){OPEN.add(ad.dataset.apriDopo);APRI_DOPO=ad.dataset.apriDopo;return}
 const td=t.closest('[data-todo]');if(td){TODO_APERTO=!TODO_APERTO;rerender();return}
 const tu=t.closest('[data-tutto]');if(tu){const k=tu.dataset.tutto;SHOW_ALL.has(k)?SHOW_ALL.delete(k):SHOW_ALL.add(k);rerender();return}
 const ed=t.closest('[data-edit]');if(ed){EDIT.add(ed.dataset.edit);SHOW_ALL.add(ed.dataset.edit);rerender();return}
 const di=t.closest('[data-dida]');if(di){const [e,c]=di.dataset.dida.split('|');DIDA[e]=c;rerender();return}
 const rg=t.closest('[data-regole]');if(rg){REGOLE_APERTE=!REGOLE_APERTE;store.set('kit4:regole',REGOLE_APERTE?'aperte':'chiuse');rerender();return}
 const cs=t.closest('[data-caso]');if(cs){const i=+cs.dataset.caso;CASO_APERTO.has(i)?CASO_APERTO.delete(i):CASO_APERTO.add(i);rerender();return}
 if(t.closest('[data-casi]')){CASI_TUTTI=true;rerender();return}
 if(t.closest('[data-bloccato]')){const s=t.closest('.msg-b');const f=s&&s.querySelector('.fill input:not(.done)');toast('Prima completa le parti mancanti',true);if(f)f.focus();return}
 const rp=t.closest('[data-ripristina]');if(rp){const [e,m]=trova(...rp.dataset.ripristina.split('|'));store.del(chiave(e,m));rerender();toast('Testo originale ripristinato');return}
 const cv=t.closest('[data-copia-val]');if(cv){toast(await copia(cv.dataset.copiaVal)?'Copiato':'Non riesco a copiare: tieni premuto sul testo',!1);return}
 const cp=t.closest('[data-copia]');if(cp){const [e,m]=trova(...cp.dataset.copia.split('|'));toast(await copia(testoFinale(e,m))?(m.canale==='storia'?'Link copiato':'Testo copiato'):'Non riesco a copiare: tieni premuto sul testo');return}
 const wa=t.closest('[data-wa]');if(wa){const [e,m]=trova(...wa.dataset.wa.split('|'));wa.href='https://wa.me/?text='+encodeURIComponent(testoFinale(e,m));return}
 const fl=t.closest('[data-file]');if(fl){try{const f=new File([await blobDi(fl.dataset.file)],fl.dataset.nome,{type:fl.dataset.file.endsWith('.pdf')?'application/pdf':'image/'+(fl.dataset.file.endsWith('.png')?'png':'jpeg')});
   if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}toast('Questo browser non condivide file: usa «Scarica»',true)}catch(err){if(err&&err.name!=='AbortError')toast('Condivisione non riuscita, riprova',true)}return}
 const sh=t.closest('[data-condividi]');
 if(sh){const [e,m]=trova(sh.dataset.ev,sh.dataset.m);const modo=sh.dataset.condividi;const testo=testoFinale(e,m);
  if(modo!=='testo')await copia(testo);
  try{const fs=await Promise.all((m.imgs||[m.img]).map(async(u,i)=>new File([await blobDi(u)],String(i+1).padStart(2,'0')+'-'+u.split('/').pop(),{type:'image/jpeg'})));
   if(navigator.canShare&&navigator.canShare({files:fs})){
    if(modo==='copia')toast('Didascalia copiata: nell\'app tieni premuto e Incolla');
    if(modo==='solo')toast('Link copiato: aggiungilo con l\'adesivo Link');
    await navigator.share(modo==='testo'?{files:fs,text:testo}:{files:fs});return}
   toast('Questo browser non condivide immagini: tieni premuto sull\'immagine per salvarla',true)}
  catch(err){if(err&&err.name==='AbortError')return;toast('Condivisione non riuscita, riprova',true)}
  return}
});
document.addEventListener('input',ev=>{
 const t=ev.target;
 if(t.matches('[data-k]')){store.set(t.dataset.k,t.value);const box=t.closest('.msg-b');
  if(box){const [e,m]=trova(t.dataset.ev,t.dataset.m);const ch=box.querySelector('.editor-l');if(ch&&!ch.querySelector('.chip-edit')){ch.insertAdjacentHTML('beforeend',`<span class="chip chip-edit">${ic('edit','s')}Modificato</span>`)}
   clearTimeout(window._ri);window._ri=setTimeout(()=>{const a=document.activeElement;const id=a&&a.id;const s=a&&a.selectionStart;if(quadre(t.value).length!==quadre(m.t).length||daCompletare(e,m)!==box.closest('.msg').classList.contains('todo')){rerender();const n=id&&document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(s,s)}catch(x){}}}},600)}
  return}
 if(t.matches('[data-fill]')){const [ev2,id]=t.dataset.fill.split('|');const [e,m]=trova(ev2,id);const f=fills(e,m);f[t.dataset.q]=t.value;store.set(kFill(e,m),JSON.stringify(f));
  t.classList.toggle('done',!!t.value.trim());
  const box=t.closest('.msg-b');const pv=box&&box.querySelector('.editor.anteprima');if(pv)pv.innerHTML=anteprimaTesto(e,m);
  clearTimeout(window._rf);window._rf=setTimeout(()=>{const cur=t.id,s=t.selectionStart;rerender();const n=document.getElementById(cur);if(n){n.focus();try{n.setSelectionRange(s,s)}catch(x){}}},700)}
});
/* tema scuro */
const mq=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');
function tema(){$('#app').classList.toggle('dark',!!(mq&&mq.matches))}
if(mq&&mq.addEventListener)mq.addEventListener('change',tema);
tema();route();
</script>
